<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherApp</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="city name" spellcheck="false" class="input">
            <button><img src="weather-app-img\images\search.png" id="search"></button>
        </div>
        <div class="weather">
            <img src="weather-app-img\images\rain.png" class="weather-icon" alt="">
        </div>
        <h1 class="temp"> 22°C</h1>
        <h2 class="city">new York</h2>
        <div class="details">
            <div class="col">
                <img src="weather-app-img\images\humidity.png" alt="">
                <div>
                    <p class="humidity">50%</p>
                    <p>Humidity</p>
                </div>
            </div>
              <div class="col">
                <img src="weather-app-img\images\wind.png" alt="">
                <div>
                    <p class="wind">15km/h</p>
                    <p>wind speed</p>
                </div>
            </div>
        </div>
    </div>

<script src="index.js"></script>
</body>

</html>
